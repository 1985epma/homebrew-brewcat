name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y pkg-config shellcheck
          libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev
          libgl1-mesa-dev libegl1-mesa-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint (window and command line only)
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Tests (window and command line only)
        run: |
          cargo test
          cargo test --no-default-features
      - name: Catalog structure
        run: cargo run --example validate_catalog --no-default-features -- --offline
      - name: Shell scripts (syntax)
        run: bash -n install.sh scripts/build-dmg.sh scripts/release.sh
      - name: Shell scripts (shellcheck)
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/*.sh
      - name: Formula and cask parse
        run: ruby -c Formula/brewcat.rb && ruby -c Casks/brewcat.rb
