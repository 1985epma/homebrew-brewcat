name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.13"]  # oldest supported and newest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tools
        run: python -m pip install --upgrade pip pytest ruff mypy
      - name: Install Tk and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tk xvfb shellcheck
      - name: Lint (real bugs only)
        run: ruff check .
      - name: Type check
        # mypy needs Python >= 3.10 to run; it still checks the code as 3.10 (see [tool.mypy])
        if: matrix.python-version != '3.9'
        run: mypy
      - name: Catalog structure
        run: python scripts/validate_catalog.py --offline
      - name: Tests (with a virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -rs
      - name: Tests (no GUI smoke test on the macOS runner)
        if: runner.os == 'macOS'
        run: python -m pytest --ignore=tests/test_gui_smoke.py
      - name: Shell scripts (syntax)
        run: bash -n install.sh scripts/build-dmg.sh scripts/release.sh
      - name: Shell scripts (shellcheck)
        if: runner.os == 'Linux'
        run: shellcheck install.sh scripts/*.sh
      - name: Formula and cask parse
        run: ruby -c Formula/brewcat.rb && ruby -c Casks/brewcat.rb
