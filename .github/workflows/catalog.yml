name: Catalog check

# Packages get renamed, deprecated or disabled in Homebrew all the time. This job fails (and GitHub
# emails the owner) when a package in the curated catalog no longer exists or was disabled.
on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - data/catalog.json

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Needs no window: the check only reads the catalog and Homebrew's public API (through curl).
      - run: cargo run --example validate_catalog --no-default-features
