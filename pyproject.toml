[project]
name = "brewcat"
description = "Visual catalog of Homebrew packages, skills and MCP servers"
requires-python = ">=3.9"
dynamic = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Real bugs only (pyflakes + syntax/runtime errors); style is not enforced yet.
select = ["E4", "E7", "E9", "F"]
